<!DOCTYPE html>
<html lang="es" data-gate="waiting">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#071a3a">
  <meta name="description" content="Una sorpresa de cumpleaños hecha especialmente para Jimena del Pilar.">
  <title>Felices 16, Jimena del Pilar 💙</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&family=DM+Sans:wght@400;500;700&family=Playfair+Display:ital,wght@0,600;0,700;1,600&display=swap" rel="stylesheet">
  <style>
/* =========================================================
   Felices 16, Jimena Pilar — estilos
   Móvil primero · azul profundo + cielo · animaciones con
   transform/opacity para que vayan fluidas en teléfono
   ========================================================= */

:root {
  --ink: #04122b;
  --deep: #071a3a;
  --navy: #0b2a63;
  --blue: #2f7be0;
  --sky: #7cc0ff;
  --ice: #d9efff;
  --glow: #9fd3ff;
  --pink: #ffb8dc;
  --gold: #ffe08a;
  --text: #eaf5ff;
  --muted: #a9cdf0;
  --glass: rgba(255, 255, 255, .07);
  --glass-line: rgba(160, 210, 255, .22);
  --ease: cubic-bezier(.2, .8, .2, 1);
  --spring: cubic-bezier(.34, 1.56, .64, 1);
  --safe-b: env(safe-area-inset-bottom, 0px);
}

*, *::before, *::after { box-sizing: border-box; }
html { background: var(--deep); scroll-behavior: smooth; -webkit-text-size-adjust: 100%; }
[hidden] { display: none !important; }
.hidden { display: none !important; }

body {
  margin: 0;
  color: var(--text);
  font-family: 'DM Sans', system-ui, sans-serif;
  line-height: 1.6;
  overflow-x: hidden;
  -webkit-tap-highlight-color: transparent;
}
body::before { /* fondo fijo que no se re-pinta al hacer scroll */
  content: '';
  position: fixed; inset: 0; z-index: -3;
  background:
    radial-gradient(120% 60% at 50% 0%, #1b4fa6 0%, transparent 60%),
    linear-gradient(180deg, #050f27 0%, #0a2559 40%, #0d3a85 75%, #0a2559 100%);
}
body.locked { overflow-x: hidden; } /* antes bloqueaba el scroll y en pantallas bajas tapaba la cuenta regresiva */

button { font: inherit; color: inherit; cursor: pointer; touch-action: manipulation; }
button:focus-visible { outline: 3px solid var(--glow); outline-offset: 4px; }

h1, h2, h3 { font-family: 'Playfair Display', Georgia, serif; line-height: 1.15; margin: 0; }

canvas { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; }
#bg { z-index: -2; }
#fx { z-index: 50; }

.progress { position: fixed; top: 0; left: 0; right: 0; height: 3px; z-index: 60; }
.progress i {
  display: block; height: 100%; transform-origin: 0 50%; transform: scaleX(0);
  background: linear-gradient(90deg, var(--sky), #fff, var(--pink));
  box-shadow: 0 0 12px var(--glow);
}

.eyebrow {
  margin: 0 0 10px;
  text-transform: uppercase; letter-spacing: .2em;
  font-size: .72rem; font-weight: 700; color: var(--sky);
}
.lead { color: var(--muted); font-size: 1.02rem; max-width: 560px; margin: 14px auto 0; }

/* ---------- Botones ---------- */
.btn {
  position: relative; overflow: hidden; isolation: isolate;
  border: 0; border-radius: 100px;
  padding: 16px 30px; min-height: 52px;
  font-weight: 700; letter-spacing: .01em; color: #fff;
  background: linear-gradient(120deg, #4aa3ff, #2563d4);
  box-shadow: 0 14px 34px rgba(47, 123, 224, .45), inset 0 1px 0 rgba(255, 255, 255, .35);
  transition: transform .3s var(--ease), box-shadow .3s var(--ease);
}
.btn::after { /* brillo que cruza el botón */
  content: ''; position: absolute; inset: 0; z-index: -1;
  background: linear-gradient(105deg, transparent 35%, rgba(255, 255, 255, .45) 50%, transparent 65%);
  transform: translateX(-120%); animation: shine 3.6s 1.5s infinite;
}
.btn:active { transform: scale(.96); }
.btn.ghost {
  background: var(--glass); border: 1px solid var(--glass-line);
  box-shadow: none; backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
  padding: 13px 24px; min-height: 48px;
}
.btn.ghost::after { display: none; }
@media (hover: hover) { .btn:hover { transform: translateY(-3px); } }

/* ---------- Hero ---------- */
.hero {
  position: relative; min-height: 100svh; display: grid; place-items: center;
  text-align: center; overflow: hidden;
  padding: max(40px, env(safe-area-inset-top)) 20px calc(40px + var(--safe-b));
}
.aurora { position: absolute; inset: 0; pointer-events: none; overflow: hidden; }
.aurora::before, .aurora::after {
  content: ''; position: absolute; width: 130vmax; height: 130vmax; border-radius: 50%;
  background: radial-gradient(closest-side, rgba(74, 163, 255, .5), transparent);
  will-change: transform; animation: drift 16s ease-in-out infinite alternate;
}
.aurora::before { top: -70vmax; left: -50vmax; }
.aurora::after {
  bottom: -80vmax; right: -60vmax; animation-duration: 22s; animation-direction: alternate-reverse;
  background: radial-gradient(closest-side, rgba(255, 184, 220, .22), transparent);
}
.hero-content { position: relative; z-index: 1; max-width: 760px; width: 100%; }

.hero-in { opacity: 0; transform: translateY(18px); animation: heroIn 1s var(--ease) var(--d, 0s) forwards; }

.hero-flower { width: min(60vw, 250px, 27vh); margin: 4px auto 6px; position: relative; }
.hero-flower::before { /* halo */
  content: ''; position: absolute; inset: -22%; z-index: -1; border-radius: 50%;
  background: radial-gradient(closest-side, rgba(159, 211, 255, .55), transparent 70%);
  animation: breathe 4.5s ease-in-out infinite;
}
.hero-flower > svg { filter: drop-shadow(0 16px 24px rgba(0, 20, 70, .55)); animation: float 5s ease-in-out infinite; }

h1 { font-size: clamp(1.9rem, min(9.6vw, 8.5vh), 5.4rem); margin: 8px 0 14px; text-shadow: 0 6px 40px rgba(60, 140, 255, .55); }
h1 .line { display: block; }
h1 .w { display: inline-block; white-space: nowrap; }
h1 .ch { display: inline-block; opacity: 0; transform: translateY(60%) rotate(8deg) scale(.9); filter: blur(8px);
  animation: chIn 1s var(--ease) calc(.55s + var(--c) * 45ms) forwards; }
h1 em { font-style: normal; }
h1 em .ch {
  background: linear-gradient(110deg, #7cc0ff 20%, #fff 45%, #7cc0ff 70%);
  background-size: 250% 100%; -webkit-background-clip: text; background-clip: text; color: transparent;
  animation: chIn 1s var(--ease) calc(.55s + var(--c) * 45ms) forwards, sheen 4s linear 2s infinite;
}
.heart { font-weight: 400; font-size: .6em; display: inline-block; animation: beat 1.6s ease-in-out 2.2s infinite; }

.subtitle { font-size: 1.08rem; margin: 6px auto 20px; color: var(--ice); max-width: 420px; }

.countdown { margin: 0 auto 26px; max-width: 360px; }
.cd-label { font-size: .72rem; letter-spacing: .18em; text-transform: uppercase; color: var(--sky); margin-bottom: 10px; font-weight: 700; }
.cd-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
.cd-grid > div {
  background: var(--glass); border: 1px solid var(--glass-line); border-radius: 16px; padding: 10px 4px 8px;
  backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
}
.cd-grid b { display: block; font-family: 'Playfair Display', serif; font-size: 1.7rem; line-height: 1.1; font-variant-numeric: tabular-nums; }
.cd-grid span { font-size: .68rem; color: var(--muted); text-transform: uppercase; letter-spacing: .1em; }
.countdown.today .cd-grid { display: none; }
.countdown.today .cd-label { font-family: 'Playfair Display', serif; font-size: 1.4rem; letter-spacing: 0; text-transform: none; color: var(--gold); }

#startButton { animation: heroIn 1s var(--ease) var(--d) forwards, pulse 2.6s 3s infinite; }
.tiny { font-size: .78rem; color: var(--muted); opacity: .8; margin: 18px 0 0; }

.scroll-hint { position: absolute; bottom: calc(18px + var(--safe-b)); left: 50%; width: 22px; height: 36px; margin-left: -11px;
  border: 2px solid var(--sky); border-radius: 14px; opacity: 0; transition: opacity .6s; }
.scroll-hint i { position: absolute; left: 50%; top: 6px; width: 4px; height: 8px; margin-left: -2px; border-radius: 4px; background: var(--sky); animation: wheel 1.8s infinite; }
.scroll-hint.show { opacity: .8; }

/* ---------- Gerbera (SVG generado por JS) ---------- */
.gerbera-host svg { display: block; width: 100%; height: auto; overflow: visible; }
.gerbera-host .pt {
  transform-box: view-box; transform-origin: 100px 100px; transform: scale(0);
  transition: transform 1.1s var(--spring) calc(var(--i) * 13ms);
}
.on .pt, .gerbera-host.on .pt { transform: scale(1); }
.gerbera-host .core { transform-box: view-box; transform-origin: 100px 100px; transform: scale(0); transition: transform .9s var(--spring) 1.1s; }
.on .core, .gerbera-host.on .core { transform: scale(1); }
.gerbera-host .stem-path { stroke-dasharray: 1; stroke-dashoffset: 1; transition: stroke-dashoffset 1.5s var(--ease) .15s; }
.on .stem-path { stroke-dashoffset: 0; }
.gerbera-host .leaf { transform-box: fill-box; transform-origin: 50% 100%; transform: scale(0); transition: transform 1.1s var(--spring) calc(.7s + var(--i) * .14s); }
.on .leaf { transform: scale(1); }

/* ---------- Secciones ---------- */
.sec { position: relative; max-width: 980px; margin: 0 auto; padding: clamp(64px, 14vw, 110px) 20px; text-align: center; }
.sec h2 { font-size: clamp(1.9rem, 7.4vw, 3rem); }
.big-icon { display: inline-block; font-size: 3.4rem; margin-bottom: 10px; animation: float 4s ease-in-out infinite; }
.intro { padding-bottom: 30px; }

.glass {
  margin: 18px 14px; padding-left: 18px; padding-right: 18px;
  background: var(--glass); border: 1px solid var(--glass-line); border-radius: 32px;
  backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
  box-shadow: 0 30px 80px rgba(0, 10, 40, .35), inset 0 1px 0 rgba(255, 255, 255, .12);
}
@media (min-width: 1040px) { .glass { margin-left: auto; margin-right: auto; } }

.js .reveal { opacity: 0; transform: translateY(34px) scale(.98); filter: blur(4px);
  transition: opacity .9s var(--ease), transform .9s var(--ease), filter .9s var(--ease); transition-delay: var(--d, 0s); }
.js .reveal.in { opacity: 1; transform: none; filter: none; }

/* mensajes */
.msg {
  display: grid; place-items: center; min-height: 76px; max-width: 520px; margin: 18px auto 0; padding: 16px 22px;
  background: rgba(124, 192, 255, .14); border: 1px solid var(--glass-line); border-radius: 20px; font-weight: 600; font-size: 1.05rem;
}
.swap { animation: swap .7s var(--ease); }

/* ---------- Jardín ---------- */
.flowers { display: grid; grid-template-columns: repeat(2, 1fr); gap: 6px 4px; max-width: 520px; margin: 28px auto 8px; }
.flower { position: relative; background: transparent; border: 0; padding: 4px 4px 10px; border-radius: 24px; }
.flower .gerbera-host { position: relative; display: block; width: min(42vw, 176px); margin: 0 auto; transition: transform .5s var(--spring); filter: drop-shadow(0 12px 14px rgba(0, 15, 60, .45)); animation: sway 6s ease-in-out infinite; transform-origin: 50% 96%; }
.flower:nth-child(even) .gerbera-host { animation-delay: -3s; }
.flower:active .gerbera-host { transform: scale(.94); }
.flower.pop .gerbera-host { animation: pop .8s var(--spring); }
.flower.seen .gerbera-host { filter: drop-shadow(0 0 16px rgba(159, 211, 255, .75)); }
.flower .pt { transition-delay: calc(.45s + var(--i) * 13ms); }
.flower .core { transition-delay: 1.6s; }

.dots { display: flex; justify-content: center; gap: 8px; margin: 6px 0 4px; }
.dots i { width: 9px; height: 9px; border-radius: 50%; background: rgba(255, 255, 255, .2); transition: background .4s, box-shadow .4s, transform .4s var(--spring); }
.dots i.on { background: var(--gold); box-shadow: 0 0 12px var(--gold); transform: scale(1.25); }

/* ---------- Tarjetas que se voltean ---------- */
.cards { display: grid; grid-template-columns: repeat(2, 1fr); gap: 14px; margin-top: 30px; perspective: 1000px; }
.fcard { position: relative; border: 0; background: none; padding: 0; height: 206px; transform-style: preserve-3d; transition: transform .8s var(--ease); }
.fcard.flipped { transform: rotateY(180deg); }
/* la regla de aparición (.reveal.in) tiene más peso y anulaba el giro: se reafirma aquí */
.js .fcard.reveal { transition: opacity .9s var(--ease) var(--d, 0s), filter .9s var(--ease) var(--d, 0s), transform .8s var(--ease) var(--d, 0s); }
.js .fcard.reveal.in.flipped { transform: rotateY(180deg); }
.face {
  position: absolute; inset: 0; display: grid; place-content: center; justify-items: center; gap: 4px; padding: 16px 14px; border-radius: 26px;
  -webkit-backface-visibility: hidden; backface-visibility: hidden;
  border: 1px solid var(--glass-line);
}
.front { background: linear-gradient(160deg, rgba(255, 255, 255, .14), rgba(255, 255, 255, .04)); box-shadow: 0 16px 40px rgba(0, 10, 40, .3); }
.front em { font-style: normal; font-size: 2.8rem; animation: float 4s ease-in-out infinite; }
.fcard:nth-child(2) .front em { animation-delay: -1s; } .fcard:nth-child(3) .front em { animation-delay: -2s; } .fcard:nth-child(4) .front em { animation-delay: -3s; }
.front h3 { font-size: 1.2rem; }
.back { transform: rotateY(180deg); background: linear-gradient(160deg, #3f93f5, #1f55bd 70%, #173f8c); gap: 8px; box-shadow: 0 16px 40px rgba(0, 10, 50, .35), inset 0 1px 0 rgba(255, 255, 255, .25); }
.back::before { content: ''; position: absolute; inset: 7px; border: 1px solid rgba(255, 255, 255, .22); border-radius: 20px; pointer-events: none; }
.back .orn { font-style: normal; font-size: 1.15rem; line-height: 1; filter: drop-shadow(0 2px 6px rgba(0, 20, 80, .4)); }
.back .heart-line { font-style: normal; font-size: .8rem; line-height: 1; opacity: .85; }
.back p { margin: 0; font-family: 'Playfair Display', Georgia, serif; font-style: italic; font-weight: 600; font-size: clamp(.95rem, 4.2vw, 1.1rem); line-height: 1.38; text-wrap: balance; text-shadow: 0 2px 10px rgba(0, 20, 80, .45); }
.back p.long { font-size: clamp(.84rem, 3.7vw, 1rem); line-height: 1.34; }

/* ---------- Tocho ---------- */
.field { position: relative; height: 210px; max-width: 440px; margin: 26px auto 0; --dx: 240px; }
.goal { position: absolute; right: 6%; bottom: 6px; height: 190px; width: auto; filter: drop-shadow(0 0 10px rgba(255, 224, 138, .5)); }
.grass { position: absolute; left: 0; right: 0; bottom: 0; height: 8px; border-radius: 8px; background: linear-gradient(90deg, transparent, rgba(95, 210, 176, .6), transparent); }
.ball { position: absolute; left: 6%; bottom: 8px; border: 0; background: none; padding: 10px; font-size: 3.4rem; line-height: 1; filter: drop-shadow(0 8px 10px rgba(0, 10, 40, .5)); animation: float 3s ease-in-out infinite; }
.ball.kick { animation: kick 1.5s cubic-bezier(.3, .6, .4, 1) forwards; pointer-events: none; }
.ball.back-in { animation: ballIn .7s var(--spring); }

/* ---------- Pastel ---------- */
.cake-wrap { position: relative; width: min(390px, 94vw); margin: 30px auto 0; }
.cake-wrap svg { display: block; width: 100%; height: auto; overflow: visible; filter: drop-shadow(0 26px 30px rgba(0, 8, 40, .45)); }
.glow { transition: opacity .9s ease; }
.glow-pulse { animation: glowPulse 1.6s ease-in-out infinite alternate; }
.candle { cursor: pointer; outline: none; -webkit-tap-highlight-color: transparent; }
.candle .hit { fill: transparent; stroke: transparent; }
.candle:focus-visible .hit { stroke: var(--glow); stroke-width: 2; }
.flame-wrap { transition: opacity .35s ease; }
.flame-g { transform-box: fill-box; transform-origin: 50% 100%; animation: flicker .22s ease-in-out infinite alternate; }
.candle:nth-of-type(2) .flame-g { animation-delay: -.11s; }
.candle.out .flame-wrap { opacity: 0; }
.candle .smoke { opacity: 0; }
.candle.out .smoke { animation: smoke2 2.4s ease-out forwards; }

.counter { margin: 26px 0 14px; font-weight: 700; color: var(--ice); }
.wish { margin: 24px auto 0; font-family: 'Playfair Display', serif; font-size: 1.5rem; line-height: 1.35; color: var(--gold); text-shadow: 0 0 24px rgba(255, 224, 138, .45); animation: wishIn 1.1s var(--spring); }

/* ---------- Carta ---------- */
.env { position: relative; display: block; width: min(270px, 72vw); aspect-ratio: 1.5; margin: 30px auto 0; padding: 0; border: 0; border-radius: 12px;
  background: linear-gradient(#2d6fc9, #1d4f9f); box-shadow: 0 24px 50px rgba(0, 10, 50, .5); animation: float 4s ease-in-out infinite; }
.env[aria-expanded="true"] { animation: none; }
.env i { position: absolute; display: block; }
.flap { inset: 0 0 auto 0; height: 58%; background: linear-gradient(#5a9df0, #3377d6); clip-path: polygon(0 0, 100% 0, 50% 100%);
  transform-origin: top; transition: transform .8s var(--ease); z-index: 2; border-radius: 12px 12px 0 0; }
.env[aria-expanded="true"] .flap { transform: rotateX(100deg); opacity: 0; transition: transform .6s var(--ease), opacity .4s .25s; }
.pocket { inset: 0; background: linear-gradient(#3b83e3, #2260bd); clip-path: polygon(0 100%, 0 14%, 50% 62%, 100% 14%, 100% 100%); z-index: 1; border-radius: 12px; }
.seal { left: 50%; top: 48%; width: 40px; height: 40px; margin: -20px 0 0 -20px; display: grid !important; place-items: center; font-style: normal; font-size: 1.3rem;
  border-radius: 50%; background: radial-gradient(circle at 35% 30%, #fff, #bfe0ff); z-index: 3; box-shadow: 0 6px 14px rgba(0, 10, 50, .4); transition: transform .5s var(--spring), opacity .4s; }
.env[aria-expanded="true"] .seal { transform: scale(0); opacity: 0; }

.letter-wrap { display: grid; grid-template-rows: 0fr; transition: grid-template-rows 1s var(--ease); }
.letter-wrap.open { grid-template-rows: 1fr; }
.letter-inner { overflow: hidden; min-height: 0; }
.paper {
  scroll-margin-top: 24px;
  max-width: 560px; margin: 26px auto 0; padding: 30px 24px 26px; text-align: left; color: #1b3a6b;
  font-family: 'Caveat', cursive; font-size: 1.4rem; line-height: 1.9em;
  background:
    repeating-linear-gradient(transparent 0 calc(1.9em - 1px), rgba(90, 150, 220, .28) calc(1.9em - 1px) 1.9em),
    #fffdf6;
  background-position: 0 2.6rem;
  border-radius: 10px; box-shadow: 0 26px 60px rgba(0, 10, 50, .5);
  transform: translateY(40px) rotate(-1.5deg); opacity: 0; transition: transform 1s var(--ease) .3s, opacity .8s .3s;
}
.letter-wrap.open .paper { transform: rotate(-.6deg); opacity: 1; }
.paper h3 { font-family: 'Caveat', cursive; font-size: 2rem; text-align: center; margin: 0 0 .4em; color: #12315f; }
.paper p { margin: 0 0 1.9em; min-height: 1.9em; }
.paper .signature { text-align: right; margin-bottom: 0; }
.paper .caret::after { content: '|'; margin-left: 1px; animation: blink .8s steps(2) infinite; color: var(--blue); }

/* ---------- Footer ---------- */
.foot { text-align: center; padding: 50px 20px calc(60px + var(--safe-b)); color: var(--muted); font-size: .85rem; }
.foot-actions { display: flex; flex-wrap: wrap; justify-content: center; gap: 12px; margin-top: 18px; }

/* ---------- Animaciones ---------- */
@keyframes heroIn { to { opacity: 1; transform: none; } }
@keyframes chIn { to { opacity: 1; transform: none; filter: none; } }
@keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-12px); } }
@keyframes sway { 0%, 100% { transform: rotate(-3deg); } 50% { transform: rotate(3deg); } }
@keyframes spin { to { transform: rotate(360deg); } }
@keyframes drift { to { transform: translate(14vmax, 8vmax) scale(1.15); } }
@keyframes breathe { 0%, 100% { transform: scale(.92); opacity: .75; } 50% { transform: scale(1.08); opacity: 1; } }
@keyframes beat { 0%, 100% { transform: scale(1); } 14% { transform: scale(1.3); } 28% { transform: scale(1); } 42% { transform: scale(1.22); } 70% { transform: scale(1); } }
@keyframes sheen { to { background-position: -250% 0; } }
@keyframes shine { 0%, 55% { transform: translateX(-120%); } 100% { transform: translateX(120%); } }
@keyframes pulse { 0% { box-shadow: 0 14px 34px rgba(47, 123, 224, .45), 0 0 0 0 rgba(124, 192, 255, .55); } 70%, 100% { box-shadow: 0 14px 34px rgba(47, 123, 224, .45), 0 0 0 20px rgba(124, 192, 255, 0); } }
@keyframes wheel { 0% { transform: translateY(0); opacity: 1; } 100% { transform: translateY(14px); opacity: 0; } }
@keyframes swap { from { opacity: 0; transform: translateY(10px) scale(.97); } to { opacity: 1; transform: none; } }
@keyframes pop { 0% { transform: scale(1); } 35% { transform: scale(1.22) rotate(10deg); } 100% { transform: scale(1); } }
@keyframes flicker { from { transform: scale(1, 1) rotate(-3deg); } to { transform: scale(.9, 1.12) rotate(3deg); } }
@keyframes smoke { 0% { opacity: .9; transform: translateY(0) scale(.5); } 100% { opacity: 0; transform: translateY(-46px) scale(2.2); } }
@keyframes kick {
  0% { transform: translate(0, 0) rotate(0) scale(1); }
  45% { transform: translate(calc(var(--dx) * .5), -170px) rotate(380deg) scale(1.05); }
  100% { transform: translate(var(--dx), -118px) rotate(760deg) scale(.6); }
}
@keyframes ballIn { from { opacity: 0; transform: scale(.3); } to { opacity: 1; transform: none; } }
@keyframes wishIn { from { opacity: 0; transform: scale(.7) translateY(20px); } to { opacity: 1; transform: none; } }
@keyframes blink { 50% { opacity: 0; } }
@keyframes glowPulse { from { opacity: .75; } to { opacity: 1; } }
@keyframes smoke2 {
  0% { opacity: 0; stroke-dashoffset: 90; transform: translateY(0); }
  20% { opacity: .85; }
  100% { opacity: 0; stroke-dashoffset: 0; transform: translateY(-16px); }
}

/* ---------- Pantallas más grandes ---------- */
@media (min-width: 720px) {
  .flowers { grid-template-columns: repeat(4, 1fr); max-width: 760px; }
  .flower .gerbera-host { width: 150px; }
  .cards { grid-template-columns: repeat(4, 1fr); }
  .fcard { height: 220px; }
  .glass { padding-left: 40px; padding-right: 40px; }

/* =========================================================

   Todo el movimiento usa transform/opacity y requestAnimationFrame;

(() => {
  'use strict';

  const $ = (s, c = document) => c.querySelector(s);
  const $$ = (s, c = document) => [...c.querySelectorAll(s)];
  const rand = (a, b) => a + Math.random() * (b - a);

     5. RELOJ EXACTO + COMPUERTA DE ACCESO
     --------------------------------------------------------- */
  // Inicio del cumpleaños: 29 de octubre de 2026, 00:00 en Ciudad de México (UTC−6, sin horario de verano).
  // Se escribe con su desfase, así es UN instante absoluto y se calcula igual en cualquier zona horaria.
  const TARGET = Date.parse('2026-10-29T00:00:00-06:00');

  // la fecha del dispositivo no sirva para adelantar el desbloqueo. Si no hay servidor (archivo local
  // o sin conexión) se usa la hora del dispositivo.
  let clockBase = Date.now(), clockPerf = performance.now(), clockSynced = false, syncSettled = false;
  const now = () => clockSynced ? clockBase + (performance.now() - clockPerf) : Date.now();

  async function syncClock() {
    if (!/^https?:$/.test(location.protocol)) { syncSettled = true; render(); return; } // archivo local: no hay servidor
    const ctl = new AbortController(), to = setTimeout(() => ctl.abort(), 4000);
    try {
      const t0 = performance.now();
      const r = await fetch(location.pathname + '?_=' + Date.now(), { method: 'HEAD', cache: 'no-store', signal: ctl.signal });
      const t1 = performance.now();
      const server = Date.parse(r.headers.get('date'));
      if (Number.isFinite(server)) {
        const age = (parseInt(r.headers.get('age'), 10) || 0) * 1000; // por si el CDN entregó una copia guardada
        clockBase = server + age + (t1 - t0) / 2; clockPerf = t1; clockSynced = true;
      }

  }

  const tpl = $('#surpriseTpl');
  const startBtn = $('#startButton');
  const hint = $('#scrollHint');
  const sub = $('#subtitle'), chip = $('#lockChip');
  const cd = { box: $('#countdown'), label: $('#cdLabel'), d: $('#cdD'), h: $('#cdH'), m: $('#cdM'), s: $('#cdS') };
  const setText = (el, v) => { v = String(v); if (el.textContent !== v) el.textContent = v; };

  try { // texto "Se abrirá el 29 de octubre, 12:00 a.m." en la hora local de quien lo abre
    $('#lockText').textContent = 'Se abrirá el ' + new Intl.DateTimeFormat('es-MX', { day: 'numeric', month: 'long', hour: 'numeric', minute: '2-digit' }).format(TARGET);
  } catch (_) {}

  let isOpen = false, sawWaiting = false, renderTimer = 0;

    sub.textContent = 'Una pequeña sorpresa hecha especialmente para ti.';
    chip.hidden = true;
    if (animate) { // llegó la hora con la página abierta
      startBtn.style.setProperty('--d', '.5s');
      sub.classList.remove('swap'); void sub.offsetWidth; sub.classList.add('swap');
      buzz([30, 40, 30, 40, 90]); try { celebrate(2); } catch (_) {}
    }
    startBtn.hidden = false;
  }

  function render() {
    clearTimeout(renderTimer);
    if (isOpen) return;
    const diff = TARGET - now();
    if (diff <= 0) {
      // nunca se abre con el reloj del dispositivo hasta haber intentado consultar la hora del servidor
      if (!syncSettled) { renderTimer = setTimeout(render, 150); return; }
      openGate(sawWaiting); return;
    }
    sawWaiting = true;
    const t = Math.floor(diff / 1000);
    setText(cd.d, Math.floor(t / 86400));
    setText(cd.h, String(Math.floor(t % 86400 / 3600)).padStart(2, '0'));

  }

  setTimeout(() => { if (!syncSettled) { syncSettled = true; render(); } }, 4500); // nada puede dejar el contador esperando

  /* ---------------------------------------------------------
     1. GERBERAS EN SVG (se dibujan por código, sin imágenes)
     --------------------------------------------------------- */
  const heroHost = $('#heroFlower');
  const PALETTES = {
    hero:     { p1: '#eaf5ff', p2: '#5ea9f7', pd: '#1d5cbd', c1: '#1c3270', c2: '#081232', dot: '#ffe08a' },
    rosa:     { p1: '#ffd6ea', p2: '#f45ea5', pd: '#a81c62', c1: '#4a2a1a', c2: '#1d0e08', dot: '#ffd86b' },
    amarilla: { p1: '#fff3a8', p2: '#ffbf1f', pd: '#d17f00', c1: '#4b2c12', c2: '#1e1006', dot: '#fff0a0' },
    naranja:  { p1: '#ffc79b', p2: '#ff6b2c', pd: '#bd3508', c1: '#40201a', c2: '#190b08', dot: '#ffd38a' },

  function rng(seed) {
    return () => {
      seed |= 0; seed = seed + 0x6D2B79F5 | 0;
      let t = Math.imul(seed ^ seed >>> 15, 1 | seed);
      t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;

    return `M0 0 C${-w * .5} ${-L * .2} ${-w * .64} ${-L * .6} ${-w * .36} ${-L * .9} Q0 ${-L * 1.06} ${w * .36} ${-L * .9} C${w * .64} ${-L * .6} ${w * .5} ${-L * .2} 0 0Z`;

  // Cabeza de la gerbera: 3 capas de pétalos con degradado, sombras y un centro con estambres
  function head(c, id, { anim = true, seed = 1 } = {}) {
    const r = rng(seed * 977 + 13);
    const layers = [
      { n: 21, L: 90, w: 13.5, g: 'a', off: 0 },
      { n: 21, L: 78, w: 13, g: 'b', off: .5 },
      { n: 18, L: 58, w: 11.5, g: 'c', off: .25 }
    ];
    let petals = '', k = 0;
    for (const ly of layers) {
      for (let i = 0; i < ly.n; i++) {
        const a = (360 / ly.n * (i + ly.off) + (r() - .5) * 5).toFixed(2);
        const L = ly.L * (1 + (r() - .5) * .1), w = ly.w * (1 + (r() - .5) * .12);
        const attrs = anim ? ` class="pt" style="--i:${k++}"` : '';
        petals += `<g transform="rotate(${a} 100 100)"><g${attrs}><g transform="translate(100 100)">` +
          `<path d="${petal(L, w)}" fill="url(#${id}${ly.g})"/>` +
          `<path d="M0 ${-L * .14} L0 ${-L * .8}" stroke="#fff" stroke-opacity=".3" stroke-width="1.1" stroke-linecap="round" fill="none"/>` +
          `</g></g></g>`;
      }
    }
    let dots = '';
    [[26, 19, 2], [16, 13, 1.8], [8, 7, 1.5]].forEach(([n, rad, size], ring) => {
      for (let i = 0; i < n; i++) {
        const ang = i * Math.PI * 2 / n + ring * .3;
        dots += `<circle cx="${(100 + Math.cos(ang) * rad).toFixed(1)}" cy="${(100 + Math.sin(ang) * rad).toFixed(1)}" r="${size}" fill="${c.dot}" opacity="${.95 - ring * .15}"/>`;
      }
    });
    return `<defs>
      <linearGradient id="${id}a" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="${c.pd}"/><stop offset=".7" stop-color="${c.p2}"/><stop offset="1" stop-color="${c.p2}"/></linearGradient>
      <linearGradient id="${id}b" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="${c.p2}"/><stop offset=".5" stop-color="${c.p2}"/><stop offset="1" stop-color="${c.p1}"/></linearGradient>
      <linearGradient id="${id}c" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="${c.p2}"/><stop offset=".75" stop-color="${c.p1}"/><stop offset="1" stop-color="${c.p1}"/></linearGradient>
      <radialGradient id="${id}d" cx="50%" cy="45%" r="60%"><stop offset="0" stop-color="${c.c2}"/><stop offset=".65" stop-color="${c.c1}"/><stop offset="1" stop-color="${c.c1}"/></radialGradient>
    </defs>${petals}
    <g${anim ? ' class="core"' : ''}>
      <circle cx="100" cy="100" r="28" fill="${c.pd}" opacity=".55"/>
      <circle cx="100" cy="100" r="25.5" fill="url(#${id}d)"/>
      <circle cx="100" cy="100" r="25.5" fill="none" stroke="${c.dot}" stroke-opacity=".5" stroke-width="1.4"/>
      ${dots}
      <ellipse cx="92" cy="90" rx="10" ry="5.5" transform="rotate(-35 92 90)" fill="#fff" opacity=".13"/>
    </g>`;
  }

  // Hoja lobulada: mitad en sombra y mitad iluminada, con nervadura central y nervaduras laterales
  const LEAF_L = 'M0 0 C-4 -8 -14 -10 -20 -8 C-14 -16 -18 -22 -26 -24 C-16 -30 -18 -40 -24 -46 C-14 -48 -12 -58 -14 -66 C-8 -64 -4 -74 0 -92Z';

      `<path d="M0 -2 L0 -88" stroke="#c9f5c4" stroke-opacity=".55" stroke-width="1.5" stroke-linecap="round" fill="none"/>` +
      `<path d="M0 -22 L-13 -29 M0 -38 L-15 -47 M0 -54 L-11 -63 M0 -24 L13 -31 M0 -40 L15 -49 M0 -56 L11 -65" stroke="#c9f5c4" stroke-opacity=".32" stroke-width=".9" fill="none" stroke-linecap="round"/>` +

    const stem = `<path class="stem-path" pathLength="1" d="M100 352 C106 250 96 170 100 100" fill="none" stroke="url(#${id}st)" stroke-width="7" stroke-linecap="round"/>` +
                 `<path class="stem-path" pathLength="1" d="M101.5 346 C107 250 98 172 101 108" fill="none" stroke="#b6f0bd" stroke-opacity=".45" stroke-width="1.6" stroke-linecap="round"/>`;

  heroHost.innerHTML = gerberaHead(PALETTES.hero, 3);

  /* ---------------------------------------------------------
     2. TÍTULO LETRA POR LETRA
     --------------------------------------------------------- */
  let charIndex = 0;
  function splitNode(node) {
    [...node.childNodes].forEach(n => {
      if (n.nodeType === 3) {
        const frag = document.createDocumentFragment();
        n.textContent.split(/(\s+)/).forEach(part => {
          if (!part) return;
          if (/^\s+$/.test(part)) { frag.appendChild(document.createTextNode(' ')); return; }
          const w = document.createElement('span'); w.className = 'w';
          [...part].forEach(ch => {
            const s = document.createElement('span'); s.className = 'ch'; s.textContent = ch;
            s.style.setProperty('--c', charIndex++); w.appendChild(s);
          });
          frag.appendChild(w);
        });
        n.replaceWith(frag);
      } else if (n.nodeType === 1 && !n.classList.contains('heart')) splitNode(n);
    });
  }
  $$('[data-split]').forEach(splitNode);
  setTimeout(() => heroHost.classList.add('on'), 350);

  /* ---------------------------------------------------------
     3. FONDO: estrellas que titilan + burbujas que suben
     --------------------------------------------------------- */
  const bg = $('#bg'), bx = bg.getContext('2d');
  let bw = 0, bh = 0, stars = [], bubbles = [], bgRunning = false;

  function sizeBg(force) {
    if (!force && Math.abs(innerWidth - bw) < 2 && Math.abs(innerHeight - bh) < 140) return; // ignora la barra del navegador
    const dpr = Math.min(devicePixelRatio || 1, 2);
    bw = innerWidth; bh = innerHeight;
    bg.width = bw * dpr; bg.height = bh * dpr;
    bx.setTransform(dpr, 0, 0, dpr, 0, 0);
    const area = bw * bh;
    stars = Array.from({ length: Math.min(90, Math.round(area / 9000)) }, () => ({
      x: rand(0, bw), y: rand(0, bh), r: rand(.5, 1.6), t: rand(0, 6.28), s: rand(.6, 1.8)
    }));
    bubbles = Array.from({ length: Math.min(18, Math.round(area / 30000) + 6) }, () => ({
      x: rand(0, bw), y: rand(0, bh), r: rand(4, 16), v: rand(.12, .4), sway: rand(0, 6.28), a: rand(.1, .28)
    }));
  }

  function drawBg(t) {
    bx.clearRect(0, 0, bw, bh);
    for (const s of stars) {
      const a = .35 + .65 * Math.abs(Math.sin(t / 1000 * s.s + s.t));
      bx.globalAlpha = a * .9; bx.fillStyle = '#d9efff';
      bx.beginPath(); bx.arc(s.x, s.y, s.r, 0, 6.283); bx.fill();
    }
    for (const b of bubbles) {
      b.y -= b.v; b.sway += .012;
      if (b.y < -30) { b.y = bh + 30; b.x = rand(0, bw); }
      const x = b.x + Math.sin(b.sway) * 14;
      bx.globalAlpha = b.a; bx.strokeStyle = '#bfe0ff'; bx.lineWidth = 1.2;
      bx.beginPath(); bx.arc(x, b.y, b.r, 0, 6.283); bx.stroke();
      bx.globalAlpha = b.a * 1.4; bx.fillStyle = '#fff';
      bx.beginPath(); bx.arc(x - b.r * .35, b.y - b.r * .35, b.r * .16, 0, 6.283); bx.fill();
    }
    bx.globalAlpha = 1;
  }
  function bgLoop(t) { if (!bgRunning) return; drawBg(t); requestAnimationFrame(bgLoop); }
  function bgStart() { if (bgRunning || reduce) return; bgRunning = true; requestAnimationFrame(bgLoop); }
  sizeBg(true);
  if (reduce) drawBg(0); else bgStart();
  document.addEventListener('visibilitychange', () => { bgRunning = false; if (!document.hidden) bgStart(); });

  /* ---------------------------------------------------------
     4. FUEGOS ARTIFICIALES + CONFETI (un solo canvas)
     --------------------------------------------------------- */
  const fx = $('#fx'), fc = fx.getContext('2d');
  let fw = 0, fh = 0, parts = [], fxRaf = 0;
  const COLORS = ['#7cc0ff', '#ffffff', '#4aa3ff', '#ffb8dc', '#ffe08a', '#bfe0ff'];

  function sizeFx() {
    const dpr = Math.min(devicePixelRatio || 1, 2);
    fw = innerWidth; fh = innerHeight;
    fx.width = fw * dpr; fx.height = fh * dpr;
    fc.setTransform(dpr, 0, 0, dpr, 0, 0);
  }
  sizeFx();
  let lastW = innerWidth;
  addEventListener('resize', () => {
    if (innerWidth !== lastW) { lastW = innerWidth; sizeFx(); sizeBg(true); } else sizeBg(false);
  });

  function burst(x, y, { n = 64, colors = COLORS, power = 1, gravity = .05 } = {}) {
    if (reduce) return;
    const hue = pick(colors);
    for (let i = 0; i < n; i++) {
      const a = (Math.PI * 2 * i) / n + rand(-.1, .1), s = rand(1.4, 4.6) * power;
      parts.push({ k: 'spark', x, y, px: x, py: y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, g: gravity,
        life: 1, decay: rand(.009, .021), c: Math.random() < .6 ? hue : pick(colors), r: rand(1.2, 2.6) });
    }
    capParts(); fxStart();
  }

  function confetti(n = 80, x0 = 0, x1 = fw) {
    if (reduce) return;
    for (let i = 0; i < n; i++) {
      parts.push({ k: 'conf', x: rand(x0, x1), y: rand(-60, -10), vx: rand(-.8, .8), vy: rand(1.4, 3.4),
        rot: rand(0, 6.28), vr: rand(-.14, .14), w: rand(6, 11), h: rand(10, 17), life: 1, decay: rand(.0035, .006),
        c: pick(COLORS), sw: rand(0, 6.28) });
    }
    capParts(); fxStart();
  }

  function capParts() { if (parts.length > 1100) parts.splice(0, parts.length - 1100); }

  function fxStep() {
    fc.clearRect(0, 0, fw, fh);
    fc.globalCompositeOperation = 'lighter';
    fc.lineCap = 'round';
    for (let i = parts.length - 1; i >= 0; i--) {
      const p = parts[i];
      p.life -= p.decay;
      if (p.life <= 0 || p.y > fh + 40) { parts.splice(i, 1); continue; }
      if (p.k === 'spark') {
        p.px = p.x; p.py = p.y;
        p.vx *= .985; p.vy = p.vy * .985 + p.g; p.x += p.vx; p.y += p.vy;
        fc.globalAlpha = Math.max(p.life, 0);
        fc.strokeStyle = p.c; fc.lineWidth = p.r;
        fc.beginPath(); fc.moveTo(p.px, p.py); fc.lineTo(p.x, p.y); fc.stroke();
      }
    }
    fc.globalCompositeOperation = 'source-over';
    for (const p of parts) {
      if (p.k !== 'conf') continue;
      p.sw += .05; p.x += p.vx + Math.sin(p.sw) * .7; p.y += p.vy; p.rot += p.vr;
      fc.save(); fc.globalAlpha = Math.min(1, p.life * 2.4);
      fc.translate(p.x, p.y); fc.rotate(p.rot); fc.scale(1, Math.cos(p.sw));
      fc.fillStyle = p.c; fc.fillRect(-p.w / 2, -p.h / 2, p.w, p.h); fc.restore();
    }
    fc.globalAlpha = 1;
    fxRaf = parts.length ? requestAnimationFrame(fxStep) : 0;
    if (!parts.length) fc.clearRect(0, 0, fw, fh);
  }
  function fxStart() { if (!fxRaf) fxRaf = requestAnimationFrame(fxStep); }

  async function fireworks(count = 6, gap = 380) {
    for (let i = 0; i < count; i++) {
      burst(rand(fw * .15, fw * .85), rand(fh * .12, fh * .5), { n: Math.round(rand(54, 90)), power: rand(.9, 1.25) });
      await wait(gap * rand(.6, 1.3));

  }

  }

  /* ---------------------------------------------------------

  const io = new IntersectionObserver(entries => {

  /* ---------------------------------------------------------

     --------------------------------------------------------- */
  function buildCake() {
    const CX = 180;
    const edge = (x, rx, ry, cy) => cy + ry * Math.sqrt(Math.max(0, 1 - ((x - CX) / rx) ** 2));

    // merengue con arándano
    const dollop = (x, y, berry) => `<g transform="translate(${x.toFixed(1)} ${y.toFixed(1)})">

      ${berry ? `<circle cx="0" cy="-15" r="6.2" fill="url(#berry)"/><circle cx="-2" cy="-17.5" r="1.7" fill="#fff" opacity=".5"/><path d="M-2.2 -20.5 L0 -17.8 L2.2 -20.5" stroke="#0a1450" stroke-width="1.1" fill="none" stroke-linecap="round" stroke-linejoin="round"/>` : ''}
    </g>`;

    // dollops alrededor del borde del piso de abajo
    const dl = [];
    const N = 15;
    for (let i = 0; i < N; i++) {
      const th = Math.PI * 2 * i / N + .2;
      dl.push({ y: 205 + 22 * Math.sin(th), svg: dollop(CX + 147 * Math.cos(th), 205 + 22 * Math.sin(th), i % 2 === 0) });
    }
    dl.sort((a, b) => a.y - b.y);
    const backD = dl.filter(d => d.y < 205).map(d => d.svg).join('');
    const frontD = dl.filter(d => d.y >= 205).map(d => d.svg).join('');

    // perlas sobre las cintas
    const pearls = (cy, rx, ry, x0, x1, step) => {
      let o = '';
      for (let x = x0; x <= x1; x += step) o += `<circle cx="${x}" cy="${edge(x, rx, ry, cy).toFixed(1)}" r="3" fill="url(#pearl)"/>`;
      return o;
    };

    // goteo de glaseado en el piso de arriba

    const lens = [16, 26, 12, 22, 30, 14, 24, 18, 28, 13, 23, 17, 27, 15];

    }

      ${pearls(258, 155, 24, 40, 320, 14)}
      <ellipse cx="180" cy="205" rx="155" ry="24" fill="url(#face)"/>
      <ellipse cx="180" cy="205" rx="155" ry="24" fill="none" stroke="#a9cdf0" stroke-width="1"/>

      <!-- piso de arriba -->

      <path d="M75 176 A105 16 0 0 0 285 176 L285 188 A105 16 0 0 1 75 188 Z" fill="url(#ribbon)"/>
      ${pearls(182, 105, 16, 88, 272, 12)}
      <ellipse cx="180" cy="135" rx="105" ry="16" fill="url(#face)"/>
      <path d="M75 135 A105 16 0 0 0 285 135 L285 146 A105 16 0 0 1 75 146 Z" fill="url(#drip)"/>
      ${drips}
      ${shells}
      ${flowerTop(112, 136, 11)}${flowerTop(248, 136, 12)}

      <!-- luz cálida de las velas sobre el pastel -->
      <g class="glow" id="cakeGlow">
        <ellipse cx="180" cy="136" rx="95" ry="20" fill="url(#topGlow)"/>
      </g>

      ${candle(148, 140, N1, 4, -56, 'Vela con forma de 1')}
      ${candle(204, 140, N6, 12, -54, 'Vela con forma de 6')}

      ${frontD}
    </svg>`;
  }

  const cakeHost = $('#cake'), counter = $('#candleCounter'), wish = $('#birthdayMessage');
  const blowAll = $('#blowAll');
  cakeHost.innerHTML = buildCake();
  const candles = $$('.candle', cakeHost);
  const glow = $('#cakeGlow', cakeHost);
  let remaining = candles.length, finished = false;

  function snuff(c) {
    if (c.classList.contains('out')) return;
    c.classList.add('out'); c.setAttribute('aria-pressed', 'true'); remaining--; buzz(12);
    glow.style.opacity = String(remaining / candles.length);
    counter.textContent = remaining === 0 ? '¡Velas apagadas! ✨' : remaining === 1 ? '1 vela encendida' : `${remaining} velas encendidas`;
    if (remaining === 0 && !finished) finale();
  }
  candles.forEach(c => {
    c.addEventListener('click', () => snuff(c));
    c.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); snuff(c); } });
  });

  function finale() {
    finished = true; blowAll.hidden = true;
    wish.classList.remove('hidden'); buzz([40, 50, 40, 50, 80]);
    setTimeout(() => celebrate(2), 300);
    setTimeout(() => wish.scrollIntoView({ behavior: reduce ? 'auto' : 'smooth', block: 'center' }), 600);
  }

  blowAll.addEventListener('click', async () => {
    blowAll.disabled = true;
    for (const c of candles.filter(x => !x.classList.contains('out'))) { snuff(c); await wait(reduce ? 0 : 280); }
  });

  /* ---------------------------------------------------------
     11. CARTA con efecto de máquina de escribir
     --------------------------------------------------------- */
  const env = $('#envelope'), wrap = $('#letterWrap'), paper = $('#paper');
  const lines = $$('[data-tw]', paper).map(el => ({ el, html: el.innerHTML }));
  let typed = false, typing = false, skip = false;

  async function typeLetter() {
    typing = true;
    lines.forEach(l => { l.el.innerHTML = ''; });
    for (const l of lines) {
      l.el.classList.add('caret');
      const tmp = document.createElement('div'); tmp.innerHTML = l.html;
      const text = tmp.textContent;
      // se escribe el texto plano y al final se restaura el HTML original (negritas, saltos de línea)
      let shown = '';
      for (const ch of text) {
        if (skip) break;
        shown += ch; l.el.textContent = shown;
        await wait(/[.,!?]/.test(ch) ? 160 : rand(18, 38));
      }
      l.el.innerHTML = l.html; l.el.classList.remove('caret');
      if (skip) { lines.forEach(x => { x.el.innerHTML = x.html; x.el.classList.remove('caret'); }); break; }
      await wait(220);
    }
    typed = true; typing = false;
  }

  env.addEventListener('click', () => {
    const opening = env.getAttribute('aria-expanded') !== 'true';
    env.setAttribute('aria-expanded', String(opening));
    wrap.classList.toggle('open', opening);
    buzz(15);
    if (opening) {
      setTimeout(() => paper.scrollIntoView({ behavior: reduce ? 'auto' : 'smooth', block: 'start' }), 1150);
      if (!typed && !typing) {
        if (reduce) { typed = true; } else setTimeout(typeLetter, 900);
        confetti(30);
      }
    }
  });
  paper.addEventListener('click', () => { if (typing) skip = true; });

  /* ---------------------------------------------------------
     12. PIE DE PÁGINA
     --------------------------------------------------------- */
  $('#moreFireworks').addEventListener('click', () => { celebrate(2); buzz(30); });
  $('#toTop').addEventListener('click', () => scrollTo({ top: 0, behavior: reduce ? 'auto' : 'smooth' }));

  } // fin mountSurprise

  onScroll();
})();

  </script>
</body>
</html>
